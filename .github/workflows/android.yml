name: Android CI

on:
  push:
    branches: ["main", "release/**", "phase/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  jvm-tests:
    name: JVM unit tests (pure-Kotlin modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Run JVM module tests
        run: >
          ./gradlew
          :core:common:test :core:state:test
          :tools:registry:test :tools:terminal:test :tools:git:test
          :ai:tasks:test
          :data:checkpoint:test :data:audit:test :data:memory:test :data:conversations:test
          --stacktrace

  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    needs: jvm-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - name: Assemble
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
