name: Android CI

on:
  push:
    branches: ["main", "release/**", "phase/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  jvm-tests:
    name: JVM unit tests (pure-Kotlin modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Run JVM module tests
        run: >
          ./gradlew
          :core:common:test :core:state:test
          :tools:registry:test :tools:terminal:test :tools:git:test :tools:capability:test
          :tools:runtime:test
          :tools:project:test :tools:tester:test :tools:debug:test
          :tools:github:test :tools:voice:test :tools:image:test :tools:audio:test
          :tools:video:test :tools:media:test :tools:subtitle:test :tools:render:test
          :ai:tasks:test :ai:runtime:test
          :data:checkpoint:test :data:audit:test :data:memory:test :data:conversations:test
          :data:backup:test :data:skills:test :data:media:test
          --stacktrace

  android:
    name: Android unit tests + assemble debug APK
    runs-on: ubuntu-latest
    needs: jvm-tests
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Run Android unit tests
        run: >
          ./gradlew
          :ai:core:testDebugUnitTest :ai:models:testDebugUnitTest
          :ai:agents:testDebugUnitTest
          :tools:gateway:testDebugUnitTest :tools:files:testDebugUnitTest :tools:editor:testDebugUnitTest
          :tools:terminal_runtime:testDebugUnitTest :tools:git_runtime:testDebugUnitTest
          :tools:builder:testDebugUnitTest
          :tools:browser_runtime:testDebugUnitTest :tools:browser:testDebugUnitTest
          :tools:debug_runtime:testDebugUnitTest :tools:memory_runtime:testDebugUnitTest
          :tools:skill_runtime:testDebugUnitTest :tools:voice_runtime:testDebugUnitTest
          :tools:image_runtime:testDebugUnitTest
          :tools:audio_runtime:testDebugUnitTest
          :tools:video_runtime:testDebugUnitTest
          :tools:subtitle_runtime:testDebugUnitTest
          :tools:render_runtime:testDebugUnitTest
          :tools:media_runtime:testDebugUnitTest
          :core:resources:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :core:common:test :core:state:test :ai:tasks:test
          :data:checkpoint:test :data:audit:test :data:memory:test :data:conversations:test
          :tools:registry:test :tools:terminal:test :tools:git:test
          --stacktrace
      - name: Fetch embedded native tools (CP-118)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd app/src/main/jniLibs/arm64-v8a
          gh release download archive/oldai-workspace -R "$GITHUB_REPOSITORY" -p 'libffmpeg-arm64.so' -p 'libffprobe-arm64.so' --clobber
          mv libffmpeg-arm64.so libffmpeg.so
          mv libffprobe-arm64.so libffprobe.so
          ls -la
      - name: Restore llama.cpp + JNI build cache (CP-123)
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libaicode_jni.so
          key: llama-jni-v0.4.1-ndk-27.0.12077973-${{ hashFiles('app/src/main/cpp/**') }}-${{ hashFiles('.github/workflows/android.yml') }}
      - name: Build llama.cpp + JNI arm64 (CP-122/123)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.0.12077973"
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          git clone --depth 1 --branch v0.4.1 https://github.com/ggml-org/llama.cpp.git /tmp/llamacpp
          cmake -S /tmp/llamacpp -B /tmp/llamacpp/build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF
          cmake --build /tmp/llamacpp/build-android --config Release -j"$(nproc)" --target llama
          cmake --build /tmp/llamacpp/build-android --config Release -j"$(nproc)" --target llama-common || \
          cmake --build /tmp/llamacpp/build-android --config Release -j"$(nproc)" --target common || \
          echo "no common target (libllama only)"
          TOOLCHAIN_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          STATIC_LIBS=$(find /tmp/llamacpp/build-android \( -name "libllama*.a" -o -name "libggml*.a" \) | tr '\n' ' ')
          echo "static libs: $STATIC_LIBS"
          test -n "$STATIC_LIBS"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          "$TOOLCHAIN_BIN/aarch64-linux-android26-clang++" \
            -shared -fPIC -O2 -std=c++17 \
            -I/tmp/llamacpp/include -I/tmp/llamacpp/ggml/include -I/tmp/llamacpp/common \
            app/src/main/cpp/aicode_jni.cpp \
            -Wl,--start-group $STATIC_LIBS -Wl,--end-group \
            -llog -landroid \
            -o app/src/main/jniLibs/arm64-v8a/libaicode_jni.so
          "$TOOLCHAIN_BIN/llvm-strip" app/src/main/jniLibs/arm64-v8a/libaicode_jni.so
          JNI_SO=app/src/main/jniLibs/arm64-v8a/libaicode_jni.so
          ls -la app/src/main/jniLibs/arm64-v8a/
          test "$(stat -c%s "$JNI_SO")" -gt 2000000
          test "$("$TOOLCHAIN_BIN/llvm-nm" --undefined-only "$JNI_SO" | grep -c "llama_")" = "0"
      - name: Restore whisper.cpp + JNI build cache (CP-140)
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libaicode_whisper.so
          key: whisper-jni-v1.9.4-ndk-27.0.12077973-${{ hashFiles('app/src/main/cpp/whisper_jni.cpp') }}-${{ hashFiles('.github/workflows/android.yml') }}
      - name: Build whisper.cpp + JNI arm64 (CP-140)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.0.12077973"
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          git clone --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp.git /tmp/whispercpp
          cmake -S /tmp/whispercpp -B /tmp/whispercpp/build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DGGML_OPENMP=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=OFF
          cmake --build /tmp/whispercpp/build-android --config Release -j"$(nproc)" --target whisper
          TOOLCHAIN_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          STATIC_LIBS=$(find /tmp/whispercpp/build-android \( -name "libwhisper*.a" -o -name "libggml*.a" \) | tr '\n' ' ')
          echo "static libs: $STATIC_LIBS"
          test -n "$STATIC_LIBS"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          "$TOOLCHAIN_BIN/aarch64-linux-android26-clang++" \
            -shared -fPIC -O2 -std=c++17 \
            -I/tmp/whispercpp/include -I/tmp/whispercpp/ggml/include \
            app/src/main/cpp/whisper_jni.cpp \
            -Wl,--start-group $STATIC_LIBS -Wl,--end-group \
            -llog -landroid \
            -o app/src/main/jniLibs/arm64-v8a/libaicode_whisper.so
          "$TOOLCHAIN_BIN/llvm-strip" app/src/main/jniLibs/arm64-v8a/libaicode_whisper.so
          WSO=app/src/main/jniLibs/arm64-v8a/libaicode_whisper.so
          ls -la app/src/main/jniLibs/arm64-v8a/
          test "$(stat -c%s "$WSO")" -gt 1000000
          test "$("$TOOLCHAIN_BIN/llvm-nm" --undefined-only "$WSO" | grep -c "whisper_")" = "0"
      - name: Restore bundled AI model (CP-144)
        id: builtin-model-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/ai/builtin-model.gguf
          key: builtin-model-qwen25-0.5b-q4km-v1
      - name: Download bundled AI model (CP-144)
        if: steps.builtin-model-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          # Qwen2.5-0.5B-Instruct Q4_K_M — Apache-2.0 (redistribution allowed, §19).
          mkdir -p app/src/main/assets/ai
          curl -L --fail --retry 3 -o app/src/main/assets/ai/builtin-model.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          ls -la app/src/main/assets/ai/
          test "$(stat -c%s app/src/main/assets/ai/builtin-model.gguf)" -gt 380000000
          test "$(head -c 4 app/src/main/assets/ai/builtin-model.gguf)" = "GGUF"
      - name: Real-inference smoke test (CP-144 §14)
        if: steps.builtin-model-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 --branch v0.4.1 https://github.com/ggml-org/llama.cpp.git /tmp/llamahost
          cmake -S /tmp/llamahost -B /tmp/llamahost/build-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DGGML_OPENMP=OFF
          cmake --build /tmp/llamahost/build-host --config Release -j"$(nproc)" || \
          cmake --build /tmp/llamahost/build-host --config Release -j1
          CLI=$(find /tmp/llamahost/build-host -name "llama-cli" -o -name "main" | head -1)
          echo "cli: $CLI"
          test -n "$CLI" && test -x "$CLI"
          OUT=$(timeout 300 "$CLI" -m app/src/main/assets/ai/builtin-model.gguf -p "สวัสดี" -n 32 -c 2048 2>/dev/null | tail -c 2000)
          echo "--- model output tail ---"
          echo "$OUT"
          test "$(printf '%s' "$OUT" | wc -c)" -gt 40
      - name: Assemble
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
