name: Android CI

on:
  push:
    branches: ["main", "release/**", "phase/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  jvm-tests:
    name: JVM unit tests (pure-Kotlin modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Run JVM module tests
        run: >
          ./gradlew
          :core:common:test :core:state:test
          :tools:registry:test :tools:terminal:test :tools:git:test :tools:capability:test
          :tools:runtime:test
          :tools:project:test :tools:tester:test :tools:debug:test
          :tools:github:test
          :ai:tasks:test
          :data:checkpoint:test :data:audit:test :data:memory:test :data:conversations:test
          :data:backup:test
          --stacktrace

  android:
    name: Android unit tests + assemble debug APK
    runs-on: ubuntu-latest
    needs: jvm-tests
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Run Android unit tests
        run: >
          ./gradlew
          :ai:core:testDebugUnitTest :ai:models:testDebugUnitTest
          :ai:agents:testDebugUnitTest
          :tools:gateway:testDebugUnitTest :tools:files:testDebugUnitTest :tools:editor:testDebugUnitTest
          :tools:terminal_runtime:testDebugUnitTest :tools:git_runtime:testDebugUnitTest
          :tools:builder:testDebugUnitTest
          :tools:browser_runtime:testDebugUnitTest :tools:browser:testDebugUnitTest
          :core:resources:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :core:common:test :core:state:test :ai:tasks:test
          :data:checkpoint:test :data:audit:test :data:memory:test :data:conversations:test
          :tools:registry:test :tools:terminal:test :tools:git:test
          --stacktrace
      - name: Assemble
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
