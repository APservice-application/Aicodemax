name: Android CI

on:
  push:
    branches: ["main", "release/**", "phase/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  jvm-tests:
    name: JVM unit tests (pure-Kotlin modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Run JVM module tests
        run: >
          ./gradlew
          :core:common:test :core:state:test
          :tools:registry:test :tools:terminal:test :tools:git:test :tools:capability:test
          :tools:runtime:test
          :tools:project:test :tools:tester:test :tools:debug:test
          :tools:github:test :tools:supabase:test :tools:voice:test :tools:image:test :tools:audio:test
          :tools:video:test :tools:media:test :tools:subtitle:test :tools:render:test
          :ai:tasks:test :ai:runtime:test
          :data:checkpoint:test :data:audit:test :data:memory:test :data:conversations:test
          :data:backup:test :data:skills:test :data:media:test
          --stacktrace

  android:
    name: Android unit tests + assemble debug APK
    runs-on: ubuntu-latest
    needs: jvm-tests
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Run Android unit tests
        run: >
          ./gradlew
          :ai:core:testDebugUnitTest :ai:models:testDebugUnitTest
          :ai:agents:testDebugUnitTest
          :tools:gateway:testDebugUnitTest :tools:files:testDebugUnitTest :tools:editor:testDebugUnitTest
          :tools:terminal_runtime:testDebugUnitTest :tools:git_runtime:testDebugUnitTest
          :tools:builder:testDebugUnitTest
          :tools:browser_runtime:testDebugUnitTest :tools:browser:testDebugUnitTest
          :tools:debug_runtime:testDebugUnitTest :tools:memory_runtime:testDebugUnitTest
          :tools:skill_runtime:testDebugUnitTest :tools:supabase_runtime:testDebugUnitTest :tools:webai:testDebugUnitTest :tools:voice_runtime:testDebugUnitTest
          :tools:image_runtime:testDebugUnitTest
          :tools:audio_runtime:testDebugUnitTest
          :tools:video_runtime:testDebugUnitTest
          :tools:subtitle_runtime:testDebugUnitTest
          :tools:render_runtime:testDebugUnitTest
          :tools:media_runtime:testDebugUnitTest
          :core:resources:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :core:common:test :core:state:test :ai:tasks:test
          :data:checkpoint:test :data:audit:test :data:memory:test :data:conversations:test
          :tools:registry:test :tools:terminal:test :tools:git:test
          --stacktrace
      - name: Restore bundled AI model (CP-144)
        id: builtin-model-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/ai
          key: builtin-model-qwen3-4b-q4km-v1
      - name: Fetch embedded AI payload (CP-146 Gradle tasks)
        run: ./gradlew :app:fetchBuiltinModel :app:fetchFfmpegLibs --console=plain --stacktrace
      - name: Join model parts for smoke test (CP-147)
        run: |
          set -e
          cat app/src/main/assets/ai/builtin-model-part*.gguf > /tmp/builtin-model.gguf
          WANT=$(grep ^total= app/src/main/assets/ai/builtin-model.manifest | cut -d= -f2)
          test "$(stat -c%s /tmp/builtin-model.gguf)" = "$WANT"
      - name: Real-inference smoke test (CP-144 §14)
        run: |
          set -e
          git clone --depth 1 --branch v0.4.1 https://github.com/ggml-org/llama.cpp.git /tmp/llamahost
          # NOTE v0.4.1: tools/cli (llama-cli target) requires LLAMA_BUILD_SERVER=ON;
          # app/llama-app is broken upstream at this tag (stale build-info.h) -> APP=OFF,
          # and build only the llama-cli target instead of 'all'.
          cmake -S /tmp/llamahost -B /tmp/llamahost/build-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_APP=OFF \
            -DGGML_OPENMP=OFF
          cmake --build /tmp/llamahost/build-host --config Release -j"$(nproc)" --target llama-cli
          CLI=$(find /tmp/llamahost/build-host -name "llama-cli" -o -name "main" | head -1)
          echo "cli: $CLI"
          test -n "$CLI" && test -x "$CLI"
          # -st (single-turn): without it llama-cli enters interactive mode and prints
          # only "> " prompts; filter any prompt echoes so the byte test proves REAL tokens.
          OUT=$(timeout 300 "$CLI" -m /tmp/builtin-model.gguf -p "สวัสดี /no_think" -n 32 -c 2048 -st 2>/dev/null | grep -v "^> " | tail -c 2000)
          echo "--- model output tail ---"
          echo "$OUT"
          test "$(printf '%s' "$OUT" | wc -c)" -gt 40
      - name: Assemble
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify Qwen3-4B payload in debug APK (all 5 parts, exact bytes)
        run: |
          python3 - <<'PY'
          import zipfile
          path = 'app/build/outputs/apk/debug/app-debug.apk'
          total = 2_497_280_256
          part_size = 536_870_912
          expected = {f'assets/ai/builtin-model-part{i:02d}.gguf': min(part_size, total - i * part_size) for i in range(5)}
          with zipfile.ZipFile(path) as apk:
              names = set(apk.namelist())
              parts = {name for name in names if name.startswith('assets/ai/builtin-model-part') and name.endswith('.gguf')}
              assert parts == set(expected), f'model parts differ: {parts ^ set(expected)}'
              for name, size in expected.items():
                  actual = apk.getinfo(name).file_size
                  assert actual == size, f'{name}: {actual} bytes; expected {size}'
              manifest = apk.read('assets/ai/builtin-model.manifest').decode('utf-8')
              assert 'parts=5' in manifest and f'total={total}' in manifest, 'model manifest mismatch'
              assert 'lib/arm64-v8a/libaicode_jni.so' in names, 'native inference engine missing'
          print(f'MODEL_QC_OK Qwen3-4B: 5 model parts, {total} uncompressed bytes in APK')
          PY
      - name: Prove embedded AI inside APK (CP-146)
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "libaicode_(jni|whisper|pty).so|libffmpeg.so|libffprobe.so|builtin-model-part.*.gguf|builtin-model.manifest"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
